# Se incluye dentro del server de Nginx que sirve el front: /api/ va al backend SyncPass,
# que solo escucha en 127.0.0.1:8080. Mismo origen que el front, así que no hace falta CORS.
location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    # Lotes de sincronización de hasta 500 registros (app Android)
    client_max_body_size 2m;
}
